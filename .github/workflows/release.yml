name: Release

# Publishes a release when a 3.x version tag is pushed:
#   git tag v3.0.0 && git push origin v3.0.0
# See CONTRIBUTING.md for the full checklist. The 2.x line releases from its own branch.

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'medaziz11' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'uptimekuma_restapi' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: The tag must be a version with an entry in CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^3\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not v3.X.Y or v3.X.Y-rc.N"
            exit 1
          fi
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi

      - name: Format, vet and test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  image:
    name: Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # v3.0.0 -> v3.0.0, v3.0, v3 and latest, as the 2.x images (v2.0.0, v2.0, v2). A
      # pre-release such as v3.0.0-rc.1 gets only v3.0.0-rc.1: for a pre-release every semver
      # pattern yields {{version}} and the automatic latest tag is not set.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_REPO }}/${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=semver,pattern={{major}},prefix=v

      # The binary reports the bare version (3.0.0-rc.1), without the tag's v.
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Cross-compiled in the build stage: no emulation needed for arm64
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Uses docs/releases/<tag>.md when it exists, generated notes otherwise.
      - name: Pick the release notes
        id: notes
        run: |
          FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$FILE" ]]; then
            echo "file=${FILE}" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.file }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          prerelease: ${{ contains(github.ref_name, '-') }}
