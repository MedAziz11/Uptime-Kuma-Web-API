name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'medaziz11' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'uptimekuma_restapi' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Test
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Emulation for the arm64 build
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tags
        id: image_tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          IMAGE="${DOCKERHUB_REPO}/${DOCKERHUB_IMAGE}"

          if [ "${EVENT_NAME}" == "pull_request" ]; then
            TAGS="${IMAGE}:pr-${PR_NUMBER}"
          elif [[ $GITHUB_REF == "refs/heads/main" ]]; then
            TAGS="${IMAGE}:latest"
          elif [[ $GITHUB_REF == "refs/heads/develop" ]]; then
            TAGS="${IMAGE}:dev"
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAGS="${IMAGE}:${GITHUB_REF#refs/tags/},${IMAGE}:latest"
          else
            echo "Error: Unexpected branch or tag"
            exit 1
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
