name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO || 'medaziz11' }}
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'uptimekuma_restapi' }}
  # Also in the Makefile
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go:
    name: Go (format, vet, tests, lint, vulnerabilities, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests (race detector)
        run: go test -race -cover ./...

      # Built from source with the Go version above: a prebuilt binary may be older than go.mod's Go.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/uptime-kuma-api

  e2e:
    name: Acceptance tests (Uptime Kuma ${{ matrix.kuma-version }})
    needs: go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest 2.x release, a middle one, newest 2.x release, moving 2.x tag
        kuma-version: ["2.0.0", "2.4.0", "2.5.11", "2"]
    env:
      KUMA_VERSION: ${{ matrix.kuma-version }}
      KUMA_USERNAME: ci-kuma-user
      KUMA_PASSWORD: Ci-kuma-password-1!
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - run: pip install -r tests/e2e/requirements.txt

      # Builds the API image from the Dockerfile and waits for both health checks
      - name: Start Uptime Kuma and the API
        run: docker compose up -d --build --wait

      - name: Create the Uptime Kuma user
        run: python tests/e2e/setup_kuma.py http://127.0.0.1:3001

      - name: Run the acceptance tests
        env:
          E2E_API_URL: http://127.0.0.1:8000
          E2E_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: python -m pytest tests/e2e -v

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker:
    name: Docker image
    needs: [go, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Images are published from main (edge) and develop (dev) only.
      # Releases are published by release.yml.
      - name: Decide what to publish
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          IMAGE="${DOCKERHUB_REPO}/${DOCKERHUB_IMAGE}"
          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/develop" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:dev" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=${IMAGE}:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Cross-compiled in the build stage: no emulation needed for arm64
      - name: Build (and push) the multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.publish.outputs.tags }}
          build-args: VERSION=3.0.0-dev+${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
