[project]
name = "uptime-kuma-web-api"
description = "A REST API wrapper for Uptime Kuma"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "B008", # FastAPI's Depends() in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/schemas/*" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error", "ignore::DeprecationWarning", "ignore::ResourceWarning"]
