services:
  kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    ports:
      - "3001:3001"
    restart: always
    volumes:
      - uptime-kuma:/app/data

  api:
    build: .
    # image: medaziz11/uptimekuma_restapi:latest
    volumes:
      - api:/db
    restart: always
    environment:
      - KUMA_SERVER=${KUMA_SERVER:-http://kuma:3001}
      - KUMA_USERNAME=${KUMA_USERNAME:?set KUMA_USERNAME in .env}
      - KUMA_PASSWORD=${KUMA_PASSWORD:?set KUMA_PASSWORD in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # Optional: when empty, a key is generated and stored in the /db volume.
      - SECRET_KEY=${SECRET_KEY:-}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION:-11520}
    depends_on:
      - kuma
    ports:
      - "8000:8000"

volumes:
  uptime-kuma:
  api:
